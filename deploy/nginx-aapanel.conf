# PC Resolve — regras de URL para Nginx no aaPanel
#
# aaPanel > Website > (seu site) > URL rewrite: cole o conteúdo abaixo e salve.
# Antes, em "Site directory", defina o "Running directory" como /public.

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Bloqueia arquivos ocultos (.env, .git, .htaccess...)
location ~ /\.(?!well-known) {
    deny all;
}

# Cache de arquivos estáticos (CSS/JS levam ?v= com a data de modificação)
location ~* \.(css|js|jpg|jpeg|png|svg|webp|ico|woff2?)$ {
    expires 30d;
    access_log off;
    try_files $uri =404;
}
